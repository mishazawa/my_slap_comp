[project]
name = "my_slap_comp"
version = "0.1.0"
description = "Compositing pipeline for my animation project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.138.0",
    "numpy>=2.5.0",
    "openexr>=3.4.13",
    "openimageio>=3.1.14.1",
    "uvicorn>=0.49.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "settings*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
